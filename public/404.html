<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>frontend</title>
</head>
<script>
  window.addEventListener('error', function (e) {
    var msg = '';
    if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
      msg = 'Resource Load Error: ' + (e.target.src || e.target.href);
    } else {
      msg = 'Error: ' + (e.message || e);
    }
    console.error(msg);
    var box = document.createElement('div');
    box.style.cssText = 'color:red; background:white; padding:20px; z-index:99999; position:fixed; top:0; left:0; width:100%; border-bottom: 2px solid black; font-family: monospace;';
    box.innerHTML = '<h3>' + msg + '</h3>';
    document.body.appendChild(box);
  }, true); 
</script>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
